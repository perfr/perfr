[package]
name = "perfr-live-render"
version = "0.1.1"
edition.workspace = true
license.workspace = true
description = "Live-trace timeline index: pixel-column raster (O(width * log n) per lane) and instance listing"

[lints]
workspace = true

[features]
default = []
# Native rayon lane split, off by default so the service does not pull rayon;
# cargo bench/test can pass `--features parallel`. The wasm viewer enables
# this via `--features wasm-threads` (nightly + atomics).
parallel = ["dep:rayon"]

[dependencies]
perfr-live-event = { path = "../perfr-live-event" }
rayon = { version = "1.10", optional = true }

[dev-dependencies]
clap = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "rasterize"
harness = false
