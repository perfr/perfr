#
# Rust perfr release for Linux x86-64 and macOS (universal).
#
# Tags are perfr-vX.Y.Z (optional suffix, e.g. perfr-v0.1.0-rc.1).
# That scheme does not collide with the legacy C++ line (v1.* and
# nightly-*). A plain perfr-vX.Y.Z becomes GitHub's Latest release.
# A suffix is published as a prerelease and is not Latest.
#
# workflow_dispatch with an empty tag builds the same artifacts and
# does not create a release or a tag. Set tag to an existing perfr-v*
# tag to attach a release to it. This workflow never creates a tag.

name: release-rust

on:
  push:
    tags:
      - "perfr-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing perfr-vX.Y.Z tag to publish. Empty builds artifacts only."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add x86_64-unknown-linux-musl
          # GNU build-id survives objcopy --strip-debug. Without it the
          # symbol store has nothing to key the debug file on.
          echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,--build-id=sha1" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-rust-linux
      - name: Build static perfr
        run: |
          set -euo pipefail
          test -f crates/perfr-live-viewer/viewer-dist/index.html
          test -f crates/perfr-live-viewer/viewer-dist/perfr_live_viewer_bg.wasm
          # perfr-live-server's build script embeds viewer-dist into the binary.
          cargo +1.88.0 build --locked --release --target x86_64-unknown-linux-musl \
            -p perfr
          bin=target/x86_64-unknown-linux-musl/release/perfr
          file "$bin"
          # musl 1.88 emits a static PIE; file(1) says "static-pie linked" for it.
          file "$bin" | grep -qE 'static(ally|-pie) linked'

      - name: Build Frida companions, API library, and GPU helper
        run: |
          set -euo pipefail
          # Frida and the GPU helper are glibc binaries. The service stays
          # static musl and looks for these next to its own executable.
          ./tools/frida/devkits.sh x86_64-unknown-linux-gnu
          cargo +1.88.0 build --locked --release \
            -p perfr-hook
          cargo +1.88.0 build --locked --release \
            -p perfr-lib --features native
          cargo +1.88.0 build --locked --release \
            -p perfr-gpu

      - name: Pack the archive and the debug symbols
        run: |
          set -euo pipefail
          pkg=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/perfr/Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#perfr-}"
          else
            ver="v${pkg}-dev"
          fi
          python3 tools/release/split_debug.py split \
            --os linux \
            --debug-dir dist/debug \
            --symstore-dir dist/symstore \
            --stripped-dir dist/stripped \
            target/x86_64-unknown-linux-musl/release/perfr \
            target/release/libperfr.so \
            target/release/perfr-gpu \
            target/release/perfr-hook
          file dist/stripped/perfr | grep -qE 'static(ally|-pie) linked'
          # The symbol table stays (a profiler symbolizes its own binary).
          # DWARF does not: it is in dist/debug, linked by .gnu_debuglink.
          readelf -S dist/stripped/perfr | grep -q '.gnu_debuglink'
          readelf -n dist/stripped/perfr | grep -q 'Build ID'

          stage=dist/perfr
          mkdir -p "$stage/include" "$stage/licenses"
          cp dist/stripped/perfr "$stage/"
          cp dist/stripped/libperfr.so "$stage/"
          cp dist/stripped/perfr-hook "$stage/"
          cp crates/perfr-api/include/perfr.h "$stage/include/perfr.h"
          cp dist/stripped/perfr-gpu "$stage/"
          cp tools/frida/licenses/* "$stage/licenses/"
          chmod 755 "$stage/perfr" "$stage/perfr-hook" "$stage/perfr-gpu"
          tar -C dist -czf perfr-linux-x86_64.tar.gz perfr
          sha256sum perfr-linux-x86_64.tar.gz | tee perfr-linux-x86_64.tar.gz.sha256

          debug_top="perfr-${ver}-linux-x86_64-debug"
          store_top="perfr-${ver}-linux-x86_64-symstore"
          mv dist/debug "dist/${debug_top}"
          mv dist/symstore "dist/${store_top}"
          tar -C dist -czf "${debug_top}.tar.gz" "$debug_top"
          tar -C dist -czf "${store_top}.tar.gz" "$store_top"
          sha256sum "${debug_top}.tar.gz" | tee "${debug_top}.tar.gz.sha256"
          sha256sum "${store_top}.tar.gz" | tee "${store_top}.tar.gz.sha256"
          python3 tools/release/split_debug.py measure \
            --label linux-x86_64 \
            --out sizes-linux-x86_64.txt \
            --core-archive perfr-linux-x86_64.tar.gz \
            --debug-archive "${debug_top}.tar.gz" \
            --symstore-archive "${store_top}.tar.gz" \
            --core-dir dist/perfr

      - uses: actions/upload-artifact@v4
        with:
          name: perfr-linux-x86_64
          path: |
            perfr-linux-x86_64.tar.gz
            perfr-linux-x86_64.tar.gz.sha256
            perfr-*-linux-x86_64-debug.tar.gz
            perfr-*-linux-x86_64-debug.tar.gz.sha256
            perfr-*-linux-x86_64-symstore.tar.gz
            perfr-*-linux-x86_64-symstore.tar.gz.sha256
            sizes-linux-x86_64.txt
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-15
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-rust-macos
      - name: Build universal service
        run: tools/build/build-service-macos.sh --universal

      - name: Pack the archive and the debug symbols
        run: |
          set -euo pipefail
          pkg=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/perfr/Cargo.toml | head -1)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            ver="${GITHUB_REF_NAME#perfr-}"
          else
            ver="v${pkg}-dev"
          fi
          python3 tools/release/split_debug.py split \
            --os macos \
            --debug-dir dist/debug \
            --symstore-dir dist/symstore \
            --stripped-dir dist/stripped \
            dist/macos-universal/perfr \
            dist/macos-universal/libperfr.dylib \
            dist/macos-universal/perfr-hook
          # strip -S invalidates the ad-hoc signature the build script wrote.
          for bin in dist/stripped/perfr dist/stripped/libperfr.dylib dist/stripped/perfr-hook; do
            codesign --force --sign - "$bin"
          done
          file dist/stripped/perfr | grep -q 'universal'

          stage=dist/perfr
          mkdir -p "$stage/include" "$stage/licenses"
          cp dist/stripped/perfr "$stage/"
          cp dist/stripped/perfr-hook "$stage/"
          cp dist/stripped/libperfr.dylib "$stage/"
          cp tools/frida/licenses/* "$stage/licenses/"
          cp dist/macos-universal/libperfr_api.a "$stage/"
          cp -R dist/macos-universal/include/. "$stage/include/"
          if [ -f dist/macos-universal/perfr_api.py ]; then
            cp dist/macos-universal/perfr_api.py "$stage/"
          fi
          if [ -f dist/macos-universal/README.md ]; then
            cp dist/macos-universal/README.md "$stage/"
          fi
          chmod 755 "$stage/perfr" "$stage/perfr-hook"
          tar -C dist -czf perfr-macos-universal.tar.gz perfr
          shasum -a 256 perfr-macos-universal.tar.gz | tee perfr-macos-universal.tar.gz.sha256

          debug_top="perfr-${ver}-macos-universal-debug"
          store_top="perfr-${ver}-macos-universal-symstore"
          mv dist/debug "dist/${debug_top}"
          mv dist/symstore "dist/${store_top}"
          tar -C dist -czf "${debug_top}.tar.gz" "$debug_top"
          tar -C dist -czf "${store_top}.tar.gz" "$store_top"
          shasum -a 256 "${debug_top}.tar.gz" | tee "${debug_top}.tar.gz.sha256"
          shasum -a 256 "${store_top}.tar.gz" | tee "${store_top}.tar.gz.sha256"
          python3 tools/release/split_debug.py measure \
            --label macos-universal \
            --out sizes-macos-universal.txt \
            --core-archive perfr-macos-universal.tar.gz \
            --debug-archive "${debug_top}.tar.gz" \
            --symstore-archive "${store_top}.tar.gz" \
            --core-dir dist/perfr

      - uses: actions/upload-artifact@v4
        with:
          name: perfr-macos-universal
          path: |
            perfr-macos-universal.tar.gz
            perfr-macos-universal.tar.gz.sha256
            perfr-*-macos-universal-debug.tar.gz
            perfr-*-macos-universal-debug.tar.gz.sha256
            perfr-*-macos-universal-symstore.tar.gz
            perfr-*-macos-universal-symstore.tar.gz.sha256
            sizes-macos-universal.txt
          if-no-files-found: error

  windows:
    name: Windows x86-64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-rust-windows
      - name: Build service and SDK
        run: .\tools\build\build-service-windows.ps1

      - name: Pack the archive and the debug symbols
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = (Select-String -Path crates\perfr\Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $ver = $env:GITHUB_REF_NAME -replace '^perfr-', ''
          } else {
            $ver = "v$pkg-dev"
          }
          python tools/release/split_debug.py split --os windows `
            --debug-dir dist/debug --symstore-dir dist/symstore --stripped-dir dist/stripped `
            dist\windows\perfr.exe dist\windows\libperfr.dll dist\windows\perfr-hook.exe `
            dist\windows\PerfrTestRust.exe

          $stage = 'dist\perfr'
          New-Item -ItemType Directory -Force $stage, "$stage\include" | Out-Null
          Copy-Item dist\stripped\perfr.exe $stage
          Copy-Item dist\stripped\perfr-hook.exe $stage
          Copy-Item dist\stripped\libperfr.dll $stage
          Copy-Item dist\stripped\PerfrTestRust.exe $stage
          New-Item -ItemType Directory -Force "$stage\licenses" | Out-Null
          Copy-Item tools\frida\licenses\* "$stage\licenses\"
          foreach ($extra in 'libperfr.dll.lib', 'perfr_api.lib', 'perfr_api.py', 'README.md') {
            $src = Join-Path 'dist\windows' $extra
            if (Test-Path $src) { Copy-Item $src $stage }
          }
          Copy-Item dist\windows\include\perfr.h "$stage\include\perfr.h"
          foreach ($required in 'perfr.exe', 'libperfr.dll', 'perfr-hook.exe', 'include\perfr.h') {
            if (-not (Test-Path (Join-Path $stage $required))) { throw "missing $required" }
          }
          if (Test-Path "$stage\perfr.pdb") { throw 'the archive must not contain PDBs' }
          Compress-Archive -Path $stage -DestinationPath perfr-windows-x86_64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 perfr-windows-x86_64.zip).Hash.ToLowerInvariant()
          "$hash  perfr-windows-x86_64.zip" | Out-File -Encoding ascii -NoNewline perfr-windows-x86_64.zip.sha256


          $debugTop = "perfr-$ver-windows-x86_64-debug"
          $storeTop = "perfr-$ver-windows-x86_64-symstore"
          Rename-Item dist\debug $debugTop
          Rename-Item dist\symstore $storeTop
          tar -C dist -czf "${debugTop}.tar.gz" $debugTop
          tar -C dist -czf "${storeTop}.tar.gz" $storeTop
          foreach ($name in @("${debugTop}.tar.gz", "${storeTop}.tar.gz")) {
            $h = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLowerInvariant()
            "$h  $name" | Out-File -Encoding ascii -NoNewline "${name}.sha256"
          }
          python tools/release/split_debug.py measure `
            --label windows-x86_64 `
            --out sizes-windows-x86_64.txt `
            --core-archive perfr-windows-x86_64.zip `
            --debug-archive "${debugTop}.tar.gz" `
            --symstore-archive "${storeTop}.tar.gz" `
            --core-dir dist\perfr

      - uses: actions/upload-artifact@v4
        with:
          name: perfr-windows-x86_64
          path: |
            perfr-windows-x86_64.zip
            perfr-windows-x86_64.zip.sha256
            perfr-*-windows-x86_64-debug.tar.gz
            perfr-*-windows-x86_64-debug.tar.gz.sha256
            perfr-*-windows-x86_64-symstore.tar.gz
            perfr-*-windows-x86_64-symstore.tar.gz.sha256
            sizes-windows-x86_64.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum ./*.tar.gz ./*.zip | tee SHA256SUMS

      - name: Upload symbol store, or skip
        env:
          PERFR_SYMBOL_STORE_BUCKET: ${{ secrets.PERFR_SYMBOL_STORE_BUCKET }}
          PERFR_SYMBOL_STORE_ENDPOINT: ${{ secrets.PERFR_SYMBOL_STORE_ENDPOINT }}
          PERFR_SYMBOL_STORE_REGION: ${{ secrets.PERFR_SYMBOL_STORE_REGION }}
          PERFR_SYMBOL_STORE_PREFIX: ${{ secrets.PERFR_SYMBOL_STORE_PREFIX }}
          PERFR_SYMBOL_STORE_ACCESS_KEY_ID: ${{ secrets.PERFR_SYMBOL_STORE_ACCESS_KEY_ID }}
          PERFR_SYMBOL_STORE_SECRET_ACCESS_KEY: ${{ secrets.PERFR_SYMBOL_STORE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # Skips with a message when the bucket or credentials are unset.
          # The symstore archives are still release assets. docs/releasing.md.
          shopt -s nullglob
          mkdir -p /tmp/perfr-symstore
          found=0
          for archive in dist/*-symstore.tar.gz; do
            tar -C /tmp/perfr-symstore -xzf "$archive"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "symbol store upload: no symstore archives were built"
            exit 0
          fi
          mapfile -t dirs < <(find /tmp/perfr-symstore -mindepth 1 -maxdepth 1 -type d | sort)
          chmod +x tools/release/upload-symbols.sh
          tools/release/upload-symbols.sh "${dirs[@]}"

      - name: Publish, or stop after the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          elif [ -n "${TAG_INPUT:-}" ]; then
            tag="$TAG_INPUT"
          else
            echo "workflow_dispatch without a tag: artifacts only, no GitHub Release and no tag."
            exit 0
          fi
          if ! [[ "$tag" =~ ^perfr-v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?$ ]]; then
            echo "refusing tag '$tag'"
            echo "use perfr-vX.Y.Z or perfr-vX.Y.Z-suffix. v1.* is the legacy C++ line."
            exit 1
          fi
          notes=$(mktemp)
          python3 - "$notes" <<'PY'
          import pathlib, sys
          pathlib.Path(sys.argv[1]).write_text(
              "Rust `perfr` for Linux, macOS and Windows. The viewer is in the binary; open it in a browser.\n\n"
              "Debug info is split out, not deleted: "
              "`perfr-<version>-<target>-debug.tar.gz` and a symbol-store layout in "
              "`perfr-<version>-<target>-symstore.tar.gz` (debuginfod `buildid/<id>/debuginfo`, "
              "SymSrv `<name>/<GUIDAGE>/<name>`).\n\n"
              "**Linux x86-64** (`perfr-linux-x86_64.tar.gz`): static musl binary with the WASM viewer embedded, "
              "DWARF removed and a GNU build-id plus `.gnu_debuglink` left in place. The archive also contains:\n\n"
              "- `libperfr.so`: the library profiled programs load, for manual "
              "instrumentation and as the agent for function hooks\n"
              "- `include/perfr.h`: the C header. Installers place it in ~/.local/include "
              "(the sibling include of PERFR_INSTALL_DIR), not beside the binary. "
              "Compile with -I~/.local/include. The header loads libperfr from beside "
              "perfr on PATH\n"
              "- `perfr-hook`: attaches to a process and loads `libperfr` into it\n"
              "- `perfr-gpu` (optional NVIDIA lanes; dynamically linked)\n"
              "- `licenses/` (Frida)\n\n"
              "**macOS** (`perfr-macos-universal.tar.gz`): universal binary (Apple silicon and Intel), "
              "`libperfr.dylib`, `perfr-hook`, `libperfr_api.a`, `include/perfr.h`, and `licenses/`. "
              "The header is installed to ~/.local/include, same as Linux. Ad-hoc signed, "
              "not notarized. Manual scopes and Frida function hooks. Attaching needs a task port. No call-stack "
              "sampling, scheduler, live disassembly, or auto-profiling. No GPU helper.\n\n"
              "**Windows x86-64** (`perfr-windows-x86_64.zip`): static-CRT binaries. Beside `perfr.exe`: "
              "`libperfr.dll` (manual instrumentation and the hook agent), `perfr-hook.exe`, `perfr_api.lib` "
              "and `include\\perfr.h`, `PerfrTestRust.exe`, `licenses/`. PDBs are in the "
              "debug archive, not this zip. Call-stack sampling, the scheduler and thread states come from the kernel "
              "logger (ETW) and need an elevated prompt; manual scopes and Frida hooks do not. No auto-profiling, no "
              "kernel hook engine, no GPU helper.\n\n"
              "Checksums: `SHA256SUMS` and the per-archive `.sha256` files.\n\n"
              "Install (fails with a clear message until a non-prerelease `perfr-v*` tag exists):\n\n"
              "```\n"
              "curl -fsSL https://perfr.dev/install.sh | sh\n"
              "```\n\n"
              "Windows (PowerShell):\n\n"
              "```\n"
              "irm https://perfr.dev/install.ps1 | iex\n"
              "```\n\n"
              "This is not a legacy C++ nightly (`nightly-*` / `v1.*`).\n"
          )
          PY
          {
            echo
            echo "Sizes from this run, in bytes:"
            echo
            echo '```'
            cat dist/sizes-*.txt
            echo '```'
          } >> "$notes"
          # The repository is checked out so the symbol-store upload script is here.
          # gh still gets --repo: the release is attached to the tag, not to this branch.
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "perfr $tag" --notes-file "$notes")
          if [[ "$tag" =~ ^perfr-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            args+=(--latest)
          else
            args+=(--prerelease --latest=false)
          fi
          gh release create "$tag" dist/* "${args[@]}"
