name: live-viewer
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'crates/perfr-live-*/**'
      - 'crates/perfr-client/**'
      - 'crates/perfr-viewer/**'
      - '.github/scripts/check-viewer-boundary.py'
      - '.github/workflows/live-viewer.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'crates/perfr-live-*/**'
      - 'crates/perfr-client/**'
      - 'crates/perfr-viewer/**'
      - '.github/scripts/check-viewer-boundary.py'
      - '.github/workflows/live-viewer.yml'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: cargo test (native live-viewer crates)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@5445741acf05630efa19e221cc588ebe0842b13d # 1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The viewer crates: the server side perfr links, the trace importers,
      # the viewer, and the client on top of it (their tests run natively,
      # no window). The service crates have their own jobs.
      - name: Test the live-viewer crates
        run: >
          cargo test -p perfr-live-event -p perfr-live-ring -p perfr-live-protocol
          -p perfr-live-render -p perfr-live-server -p perfr-live-chrome
          -p perfr-viewer -p perfr-client --features perfr-client/native
      - name: Compile the viewer for wasm32
        run: cargo build -p perfr-viewer --target wasm32-unknown-unknown
      - name: Compile the client for wasm32
        run: cargo build -p perfr-client --target wasm32-unknown-unknown
      - name: The viewer does not depend on the capture pipeline or the client
        run: python3 .github/scripts/check-viewer-boundary.py
      - name: Compile benches
        run: cargo bench -p perfr-live-render -p perfr-live-ring --no-run
      # The complexity test is compiled out of debug (`cfg(not(debug_assertions))`).
      # Run it once with optimizations so CI still guards O(width log n).
      - name: Test pixel rasterizer complexity (release)
        run: cargo test -p perfr-live-render --release --lib tests::pixel_prepare_is_not_linear_in_scopes -- --exact
