# Slim embeddable viewer: one page that opens a `.perfr.stream` and draws it
# with the viewer core (`perfr-viewer`). `build_wasm.sh` builds the pack.
#
# The full page (`perfr-live-viewer`) does not depend on this crate, so the
# pack the service embeds carries none of it, and a change here does not ask
# for that pack to be rebuilt.
[package]
name = "perfr-viewer-embed"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Slim embeddable perfr viewer: opens a .perfr.stream and draws it, with no service client"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# GLES backend. With it the page falls back to WebGL when the browser has no
# WebGPU adapter, and `?webgl` asks for it. Off in the default pack, where it
# costs about 1.9 MB of wasm; `./build_wasm.sh --features webgl` turns it on.
webgl = ["wgpu/webgl"]
# egui's four default fonts in place of the Latin subset of Hack, for
# captures whose thread and process names are not Latin-1 (Cyrillic, Greek,
# symbols). About 1.4 MB of wasm; `./build_wasm.sh --features full-fonts`.
full-fonts = ["egui/default_fonts"]

[dependencies]
perfr-live-event = { path = "../perfr-live-event" }
perfr-live-render = { path = "../perfr-live-render" }
perfr-viewer = { path = "../perfr-viewer" }
# default-features off so the pack does not embed egui's four fonts.
egui = { version = "0.32.3", default-features = false }

[dev-dependencies]
perfr-live-protocol = { path = "../perfr-live-protocol" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "wayland", "x11"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.32.3", default-features = false, features = ["wgpu"] }
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
wasm-bindgen-futures = "=0.4.50"
console_error_panic_hook = "0.1"
# WebGPU, not WebGL. `webgl` above adds the GLES backend.
wgpu = { version = "25", default-features = false, features = ["webgpu", "wgsl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "HtmlCanvasElement",
    "Location",
    "Response",
    "Window",
]
