<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>perfr in-page demo</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0c0e; color: #e7e9ee; font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 2;
      background: rgba(12, 14, 18, 0.82); border: 1px solid #2c3340; border-radius: 8px;
      padding: 10px 12px; max-width: 28rem;
    }
    #hud h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
    #hud p { margin: 0 0 8px; color: #b7bec9; font-size: 12px; }
    button {
      background: #1c2430; color: inherit; border: 1px solid #3a4250;
      border-radius: 4px; padding: 4px 8px; cursor: pointer; margin-right: 6px;
    }
    code { font-family: ui-monospace, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud">
    <h1>perfr in-page</h1>
    <p>This page profiles itself. Scopes, a worker, and the browser tracks the page can see stream into the viewer below. <code>F8</code> hides it. There is no CPU sampling here: the browser does not allow it.</p>
    <button id="download" type="button">Download .perfr.stream</button>
    <button id="stall" type="button">Stall 80ms</button>
    <span id="readout"></span>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
