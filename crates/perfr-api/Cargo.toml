[package]
name = "perfr-api"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "perfr manual instrumentation: scopes, instants, links and values on a shared-memory ring a running perfr drains"
keywords = ["profiling", "tracing", "instrumentation", "perfr"]
categories = ["development-tools::profiling"]
include = ["src/**", "include/perfr.h", "README.md"]

[lints]
workspace = true

# Two shapes: rlib for Rust callers, staticlib (libperfr_api.a / perfr_api.lib)
# for C and C++ that link statically. The shared library every other caller
# loads at run time, libperfr, is built by crates/perfr-lib from this crate.
[lib]
name = "perfr_api"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "perfr-scope-dump"
path = "src/bin/perfr-scope-dump.rs"

[[bin]]
name = "perfr-scope"
path = "src/bin/perfr-scope.rs"

[dependencies]
libc = "0.2"
perfr-scope-ring = { path = "../perfr-scope-ring" }

[[bench]]
name = "log_throughput"
harness = false
