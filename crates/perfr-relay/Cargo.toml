[package]
name = "perfr-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Fan-out relay for the public live-experiment WebSocket"

[dependencies]
perfr-live-event = { path = "../perfr-live-event" }
perfr-live-protocol = { path = "../perfr-live-protocol" }
axum = { version = "0.7", features = ["ws"] }
bytes = "1"
crossbeam-epoch = "0.9"
futures-util = "0.3"
tokio-tungstenite = "0.24"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower-http = { version = "0.5.2", features = ["cors"] }

# Optional so `cargo test -p perfr-relay --features loom` can model the
# seqlock. Not a crate-wide `cfg(loom)`: tokio turns its net module off
# under that flag. 0.5 is the last loom whose `generator` dependency builds
# on this workspace's rustc 1.88.
loom = { version = "=0.5.6", optional = true }

[features]
loom = ["dep:loom"]

[[bin]]
name = "perfr-relay"
path = "src/bin/perfr-relay.rs"

[[bin]]
name = "perfr-relay-load"
path = "src/bin/perfr-relay-load.rs"
