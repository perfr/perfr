# The perfr client: the viewer with the capture service behind it. This is
# the page the service serves, the wasm32 cdylib behind viewer-dist/.
#
# The interface is `perfr-viewer`'s. What this crate adds is the layer that
# needs the service: the event socket and the requests under /api
# (`src/service.rs`), and with them capture control and sharing, which the
# viewer shows only when the host it is given has them. build_wasm.sh
# produces the pack.
[package]
name = "perfr-client"
version = "0.1.1"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/perfr/perfr"
rust-version = "1.88"
description = "The perfr client: the viewer with the capture service behind it"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Nightly + atomics + build-std. `build_wasm.sh` enables this. Plain
# `cargo build --target wasm32-unknown-unknown` stays sequential so CI
# does not need a rebuilt std.
wasm-threads = ["perfr-viewer/wasm-threads"]

[dependencies]
perfr-live-event = { path = "../perfr-live-event" }
# The interface, with the parts that need a service compiled in (`service`).
# Its defaults stay off: `page`, the viewer's own entry point, is not for
# this pack (.github/scripts/check-viewer-boundary.py holds that).
perfr-viewer = { path = "../perfr-viewer", default-features = false, features = ["service"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
wasm-bindgen-futures = "=0.4.50"
log = "0.4"
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = [
    "BinaryType",
    "Blob",
    "Event",
    "File",
    "Headers",
    "HtmlCanvasElement",
    "Location",
    "MessageEvent",
    "ProgressEvent",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "RequestRedirect",
    "Response",
    "Storage",
    "StorageEvent",
    "WebSocket",
    "XmlHttpRequest",
    "XmlHttpRequestEventTarget",
    "XmlHttpRequestUpload",
    "Window",
    "Document",
]
