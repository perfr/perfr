[package]
name = "perfr-object"
version = "0.1.1"
description = "ELF, PE and PDB metadata, symbols, line tables and debug-file lookup"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Already linked: object's "compression" feature brings it in through flate2.
crc32fast = "1"
gimli = { version = "0.31", default-features = false, features = ["read", "std"] }
msvc-demangler = "0.11"
# Replaces llvm::object. default-features = false keeps the write half, the
# archive/macho/pe readers we do not need, and their transitive deps out.
object = { version = "0.36", default-features = false, features = ["read_core", "elf", "std", "compression", "pe"] }
pdb = "0.8"
