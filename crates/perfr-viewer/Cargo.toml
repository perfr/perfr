# Viewer core: the WebGPU timeline and the `.perfr.stream` parser. A library
# only: the full page (`perfr-live-viewer`) and the slim embed
# (`perfr-viewer-embed`) are the two wasm entry points built on it.
#
# Path dependencies are an allow-list (.github/scripts/check-viewer-boundary.py):
# the event format, the stream framing, and the rasterizer. Nothing from the
# capture service, eBPF, language bindings, or the live server. Those crates
# depend on this format; this crate does not depend on them.
[package]
name = "perfr-viewer"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Viewer core: WebGPU timeline and .perfr.stream parser, with no capture-pipeline dependencies"

[lints]
workspace = true

[features]
default = ["egui"]
egui = ["dep:egui", "dep:egui-wgpu"]

[dependencies]
perfr-live-event = { path = "../perfr-live-event" }
perfr-live-protocol = { path = "../perfr-live-protocol" }
perfr-live-render = { path = "../perfr-live-render" }
# default-features off so a pack that links only this core does not embed
# egui's four fonts. The full page depends on egui with its defaults, and the
# slim embed installs its own Latin subset.
egui = { version = "0.32.3", default-features = false, optional = true }
egui-wgpu = { version = "0.32.3", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
perfr-live-render = { path = "../perfr-live-render", features = ["parallel"] }

# The frame clock in `dev.rs` when no shared clock hook is installed.
[target.'cfg(target_arch = "wasm32")'.dependencies.web-sys]
version = "0.3"
features = ["Performance", "Window"]
