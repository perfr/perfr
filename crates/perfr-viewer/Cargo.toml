# The viewer: the page that shows a capture. The timeline, the track rail,
# the reports, search, stories and the import of Chrome and Perfetto traces
# are all here, and so is the page built from them (`build_wasm.sh`), which
# opens a capture file and has no service behind it.
#
# `perfr-client` is the layer on top: the connection to the capture service,
# and with it capture control and sharing. It builds on this crate with the
# `page` feature off, so its pack has the viewer's interface and not the
# viewer's entry point.
#
# Path dependencies are an allow-list (.github/scripts/check-viewer-boundary.py):
# the event format, the stream framing, the rasterizer, the trace importers,
# the story document and the build stamp. Nothing from the capture service,
# eBPF, language bindings, or the live server.
[package]
name = "perfr-viewer"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The perfr viewer: the page that shows a capture, with no capture service behind it"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["page"]
# The viewer's own wasm entry point (`start_viewer`). `perfr-client` turns it
# off: its pack starts from its own entry point, and an entry point compiled
# in is exported from whatever links it.
page = []
# The parts of the interface that need a capture service: recording, the
# process picker, hooks, the service's settings, the code views, Share.
# `perfr-client` turns it on. The viewer's own pack is built without it, and
# then none of that code is in the pack (see `net::Host`).
#
# It brings egui's four built-in fonts with it, 1.4 MB of them. Those
# controls are what uses their symbols (a warning sign, a skull, the key
# glyphs of a shortcut). The viewer's own pack has IBM Plex and one fallback
# for the names in a capture that are not Latin (`fonts.rs`).
service = ["egui/default_fonts"]
# Nightly + atomics + build-std. `build_wasm.sh` enables this. Plain
# `cargo build --target wasm32-unknown-unknown` stays sequential so CI
# does not need a rebuilt std.
wasm-threads = ["perfr-live-render/parallel", "dep:wasm-bindgen-rayon"]

[dependencies]
perfr-build-info = { path = "../perfr-build-info" }
perfr-live-event = { path = "../perfr-live-event" }
perfr-story = { path = "../perfr-story" }
perfr-live-chrome = { path = "../perfr-live-chrome" }
perfr-live-protocol = { path = "../perfr-live-protocol" }
perfr-live-render = { path = "../perfr-live-render" }
wasm-bindgen = "=0.2.100"
js-sys = "=0.3.77"
console_error_panic_hook = "0.1"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Optional: only compiled when `--features wasm-threads` (wasm pack).
# no-bundler: viewer-dist is served as raw ES modules (no webpack/vite).
wasm-bindgen-rayon = { version = "1.3.0", features = ["no-bundler"], optional = true }
# eframe 0.32 (MSRV 1.85, wgpu 25). This workspace pins rustc 1.88.
eframe = { version = "0.32.3", default-features = false, features = ["wgpu", "wayland", "x11"] }
egui = { version = "0.32.3", default-features = false }
# Ubuntu Light, taken from here by name: the fallback font of a build
# without `service`, which leaves egui's built-in set out.
epaint_default_fonts = "0.32.3"
egui-wgpu = "0.32.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "BinaryType",
    "Blob",
    "console",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "File",
    "FileList",
    "Headers",
    "HtmlCanvasElement",
    "HtmlInputElement",
    "Location",
    "MessageEvent",
    "Navigator",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ProgressEvent",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "RequestRedirect",
    "Response",
    "Storage",
    "StorageEvent",
    "WebSocket",
    "XmlHttpRequest",
    "XmlHttpRequestEventTarget",
    "XmlHttpRequestUpload",
    "Window",
    "VisualViewport",
    "CssStyleDeclaration",
    "HtmlElement",
    "HtmlDocument",
]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
perfr-live-render = { path = "../perfr-live-render", features = ["parallel"] }
rfd = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
perfr-live-render = { path = "../perfr-live-render" }
wasm-bindgen-futures = "=0.4.50"
# WebGPU first, WebGL fallback (egui-wgpu default).
wgpu = { version = "25", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
