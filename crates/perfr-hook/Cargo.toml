[package]
name = "perfr-hook"
version = "0.1.1"
description = "perfr-hook: the Frida Core controller perfr spawns to attach to a target and load libperfr into it"
edition = "2021"
license = "BSD-2-Clause"

[dependencies]
libc = "0.2"
perfr-frida-transport = { path = "../perfr-frida-transport" }
serde_json = "1"
tempfile = "3"

[build-dependencies]
cc = "1"
perfr-frida-build = { path = "../perfr-frida-build" }
