#
# Linux build and test for the libperfr language bindings. One job builds
# libperfr; the others test against that .so. The C# job also packs a nupkg
# and uploads it. Nothing is published to NuGet. Mojo comes from pip.

name: manual-bindings
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/manual-bindings.yml'
      - 'crates/perfr-api/include/**'
      - 'crates/perfr-api/csharp/**'
      - 'crates/perfr-api/lua/**'
      - 'crates/perfr-api/zig/**'
      - 'crates/perfr-api/swift/**'
      - 'crates/perfr-api/java/**'
      - 'crates/perfr-api/julia/**'
      - 'crates/perfr-api/mojo/**'
      - 'crates/perfr-lib/**'
      - 'crates/perfr-api/src/**'
      - 'crates/perfr-scope-ring/**'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  libperfr:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Build libperfr
        run: cargo build -p perfr-lib
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libperfr
          path: target/debug/libperfr.so

  csharp:
    needs: libperfr
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            6.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libperfr
          path: dist
      - name: Test and pack
        run: |
          chmod +x crates/perfr-api/csharp/test.sh
          crates/perfr-api/csharp/test.sh "$PWD/dist/libperfr.so"
          dotnet pack crates/perfr-api/csharp/src/Perfr/Perfr.csproj -c Release -o dist/nupkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perfr-nupkg
          path: dist/nupkg/*.nupkg

  lua:
    needs: libperfr
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4 liblua5.4-dev luajit pkg-config
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libperfr
          path: dist
      - name: Test
        run: |
          chmod +x crates/perfr-api/lua/test.sh
          crates/perfr-api/lua/test.sh "$PWD/dist/libperfr.so"

  zig:
    needs: libperfr
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Zig 0.17.1
        run: |
          curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.1/zig-x86_64-linux-0.17.1.tar.xz
          # The shasum ziglang.org/download/index.json lists for this file.
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  /tmp/zig.tar.xz" | sha256sum -c -
          tar -C /tmp -xf /tmp/zig.tar.xz
          echo /tmp/zig-x86_64-linux-0.17.1 >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libperfr
          path: dist
      - name: Test
        run: |
          chmod +x crates/perfr-api/zig/test.sh
          crates/perfr-api/zig/test.sh "$PWD/dist/libperfr.so"

  swift:
    needs: libperfr
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Swift 6.1.2
        run: |
          curl -fL -o /tmp/swift.tar.gz https://download.swift.org/swift-6.1.2-release/ubuntu2404/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-ubuntu24.04.tar.gz
          # swift.org signs its archives and publishes no hash. This is the
          # hash of the archive as it was on 2026-11-18, so a later change
          # to the file fails here.
          echo "d749d5fe2d6709ee988e96b16f02bca7b53304d09925e31063fd5ec56019de9f  /tmp/swift.tar.gz" | sha256sum -c -
          mkdir -p /tmp/swift
          tar -C /tmp/swift -xzf /tmp/swift.tar.gz
          echo /tmp/swift/swift-6.1.2-RELEASE-ubuntu24.04/usr/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libperfr
          path: dist
      - name: Test
        run: |
          chmod +x crates/perfr-api/swift/test.sh
          crates/perfr-api/swift/test.sh "$PWD/dist/libperfr.so"

  java:
    needs: libperfr
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Kotlin 2.1.10
        run: |
          curl -fL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.10/kotlin-compiler-2.1.10.zip
          # The release's own kotlin-compiler-2.1.10.zip.sha256.
          echo "c6e9e2636889828e19c8811d5ab890862538c89dc2a3101956dfee3c2a8ba6b1  /tmp/kotlin.zip" | sha256sum -c -
          unzip -q -d /tmp /tmp/kotlin.zip
          echo /tmp/kotlinc/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libperfr
          path: dist
      - name: Test
        run: |
          chmod +x crates/perfr-api/java/test.sh
          crates/perfr-api/java/test.sh "$PWD/dist/libperfr.so"

  julia:
    needs: libperfr
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Julia 1.13.4
        # A release archive checked against the hash julialang.org publishes
        # for it (bin/versions.json), not an installer piped into a shell:
        # what runs here is the same bytes every time.
        run: |
          curl -fsSL -o /tmp/julia.tar.gz https://julialang-s3.julialang.org/bin/linux/x64/1.13/julia-1.13.4-linux-x86_64.tar.gz
          echo "cf1658f13b91facccd57d41464d7125a0e48a1d24f49062d71532d04d4ec4130  /tmp/julia.tar.gz" | sha256sum -c -
          tar -C /tmp -xzf /tmp/julia.tar.gz
          echo /tmp/julia-1.13.4/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libperfr
          path: dist
      - name: Test
        run: |
          chmod +x crates/perfr-api/julia/test.sh
          crates/perfr-api/julia/test.sh "$PWD/dist/libperfr.so"

  mojo:
    needs: libperfr
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Mojo
        run: |
          python -m venv /tmp/mojo
          /tmp/mojo/bin/pip install --quiet --require-hashes -r .github/requirements/mojo.txt
          echo /tmp/mojo/bin >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: libperfr
          path: dist
      - name: Test
        run: |
          chmod +x crates/perfr-api/mojo/test.sh
          crates/perfr-api/mojo/test.sh "$PWD/dist/libperfr.so"
