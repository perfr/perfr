name: checks
on:
  pull_request:
    branches:
      - 'main'

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check-license-headers:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: Check license headers
      run: ./.github/scripts/check-license-headers.sh
      shell: bash

  release-script:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck
    - name: Test the release script
      run: tools/release/test_release.sh

  # perfr.dev refuses a viewer pack whose source id does not match the
  # checkout. Catch that on the pull request, including a source change
  # that only rewrites viewer-dist/VERSION and leaves the wasm behind.
  viewer-pack:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: '0'
    - name: Check the committed viewer pack matches its sources
      run: python3 .github/scripts/check-viewer-pack.py
      shell: bash
