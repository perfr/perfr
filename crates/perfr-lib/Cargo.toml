[package]
name = "perfr-lib"
version = "0.1.1"
description = "libperfr: the manual-instrumentation API and, with `native`, the Frida Gum hook agent, in the one library loaded into profiled processes"
edition = "2021"
license = "BSD-2-Clause"

# `libperfr.so` / `libperfr.dylib`. Without `native` it is the manual API alone
# (what the perfr-api wheel ships); with `native` it also carries the Gum
# agent that perfr-hook injects. On Windows the DLL is built by
# crates/perfr-lib-windows instead, so its PDB does not collide with perfr.exe's.
[lib]
name = "perfr"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1", optional = true }
libc = "0.2"
perfr-api = { path = "../perfr-api" }
perfr-frida-transport = { path = "../perfr-frida-transport" }
perfr-scope-ring = { path = "../perfr-scope-ring" }

[dev-dependencies]
tempfile = "3"

[features]
native = ["dep:serde_json"]

[build-dependencies]
perfr-frida-build = { path = "../perfr-frida-build" }
